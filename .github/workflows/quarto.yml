name: Render and Publish Quarto site

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout repo
      - uses: actions/checkout@v4

      # 2) Install Quarto
      - uses: quarto-dev/quarto-actions/setup@v2

      # 3) Install R
      - uses: r-lib/actions/setup-r@v2

      # 4) Install JAGS system library (required by runjags)
      - name: Install JAGS
        run: sudo apt-get update -y && sudo apt-get install -y jags

      # 5) Install R packages needed for all labs
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::ggplot2
            any::dplyr
            any::tidyr
            any::readr
            any::tibble
            any::scales
            any::coda
            any::rjags
            any::runjags
          cache-version: 2

      # 6) Render the site
      - name: Render Quarto site
        run: quarto render

      # 7) Upload site for GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      # 8) Deploy to GitHub Pages
      - uses: actions/deploy-pages@v4

